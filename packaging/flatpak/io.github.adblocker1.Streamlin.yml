  # Streamlin selbst (Quelle: dieses Repository)
  - name: streamlin
    buildsystem: simple
    build-commands:
      - ./packaging/flatpak/install.sh
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - .flatpak-build
          - build-dir
          - repo
          - dist
