# Flatpak von Streamlin: LinDeck (Hauptprogramm) und Linewave (zweite Desktop-Datei).
# Bauen: packaging/flatpak/build-flatpak.sh  (oder flatpak-builder mit diesem Manifest)
# Die udev-Regeln kann ein Flatpak nicht installieren – einmalig auf dem System:
#   flatpak run --command=cat io.github.adblocker1.Streamlin /app/share/streamlin/70-streamlin.rules \
#     | sudo tee /etc/udev/rules.d/70-streamlin.rules
#   echo uinput | sudo tee /etc/modules-load.d/streamlin-uinput.conf
#   sudo modprobe uinput && sudo udevadm control --reload-rules && sudo udevadm trigger
# Starter (Hub für einen gemeinsamen Prozess-Namensraum): launcher.py, Dateien: install.sh
id: io.github.adblocker1.Streamlin
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: lindeck
finish-args:
  - --share=ipc
  - --share=network            # OBS-WebSocket, Plugins (localhost), Updates
  - --socket=x11               # Tk gibt es nur für X11 (unter Wayland über XWayland)
  - --socket=pulseaudio
  - --device=all               # Stream Deck (hidraw/USB), Wave-Mikrofon, /dev/uinput für Hotkeys
  - --filesystem=home          # Elgato-Profile/-Installer importieren, Sounds und Bilder auf Tasten
  - --filesystem=/tmp          # gemeinsame Temp-Dateien mit Programmen des Systems (msiextract …)
  - --filesystem=host-os:ro    # Desktop-Dateien der installierten Programme (/run/host/usr/share/applications)
  - --filesystem=xdg-config/autostart:create
  - --talk-name=org.freedesktop.Flatpak         # pactl, pw-cli, playerctl … laufen auf dem System
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /man
  - '*.a'
  - '*.la'
modules:
  # tkinter fehlt im Python der Freedesktop-Laufzeit: Tcl/Tk bauen und _tkinter dazu übersetzen
  - name: tkinter
    buildsystem: simple
    build-commands:
      # setuptools (für ext-modules in pyproject.toml) isoliert aus der Datei unten
      - pip3 install --verbose --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} .
    sources:
      - type: git
        url: https://github.com/iwalton3/tkinter-standalone
        commit: 8e78e38ef0cceb44a3a0062e1c314a4ff3f981db   # Python 3.13 (Laufzeit 25.08), Tcl/Tk 9.0
      - type: file
        url: https://files.pythonhosted.org/packages/a3/dc/17031897dae0efacfea57dfd3a82fdd2a2aeb58e0ff71b77b87e44edc772/setuptools-80.9.0-py3-none-any.whl
        sha256: 062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922
    modules:
      - name: tcl
        subdir: unix
        config-opts:
          - --disable-zipfs
        post-install:
          - chmod +w ${FLATPAK_DEST}/lib/libtcl9.0.so
        cleanup:
          - /bin
        sources:
          - type: archive
            url: https://prdownloads.sourceforge.net/tcl/tcl9.0.2-src.tar.gz
            sha256: e074c6a8d9ba2cddf914ba97b6677a552d7a52a3ca102924389a05ccb249b520
      - name: tk
        subdir: unix
        config-opts:
          - --disable-zipfs
        post-install:
          - chmod +w ${FLATPAK_DEST}/lib/libtcl9tk9.0.so
        cleanup:
          - /bin
        sources:
          - type: archive
            url: https://prdownloads.sourceforge.net/tcl/tk9.0.2-src.tar.gz
            sha256: 76fb852b2f167592fe8b41aa6549ce4e486dbf3b259a269646600e3894517c76

  # hidapi (libusb) für python-elgato-streamdeck
  - name: libusb
    config-opts:
      - --disable-static
      - --disable-udev
    sources:
      - type: git
        url: https://github.com/libusb/libusb
        tag: v1.0.29
        commit: 15a7ebb4d426c5ce196684347d2b7cafad862626
  - name: hidapi
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib   # sonst lib64, das der Lader in /app nicht durchsucht
      - -DHIDAPI_WITH_HIDRAW=OFF
      - -DHIDAPI_WITH_LIBUSB=ON
      - -DHIDAPI_BUILD_HIDTEST=OFF
    sources:
      - type: git
        url: https://github.com/libusb/hidapi
        tag: hidapi-0.15.0
        commit: d6b2a974608dec3b76fb1e36c189f22b9cf3650c

  # Python-Pakete (feste Versionen, Prüfsummen von PyPI)
  - name: python3-deps
    buildsystem: simple
    build-commands:
      # evdev wird gebaut; setuptools dafür kommt (isoliert) ebenfalls aus den Quellen unten
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        pillow evdev cairosvg pystray streamdeck
