name: Build .deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release v<Version> aus diesem Commit anlegen"
        type: boolean
        default: false
      replace:
        description: "Vorhandenes Release v<Version> samt Tag löschen und neu anlegen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Tests und Paket auf den ältesten unterstützten Systemen (Python 3.10/3.11, ältere Pillow/Tk)
  compat:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Tests und Paket auf ${{ matrix.image }}
        run: sh packaging/ci/compat.sh

  build:
    needs: compat
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-pil python3-evdev python3-cairosvg python3-tk \
            python3-pil.imagetk xvfb fonts-dejavu-core
          pip install --break-system-packages "streamdeck>=0.10" pyflakes pytest

      - name: Code prüfen
        run: python3 -m pyflakes freestream tests tools packaging

      - name: Tests
        run: xvfb-run -a python3 -m pytest -q tests

      - name: Pakete bauen
        run: ./packaging/build-deb.sh dist

      - name: Paket testen
        run: |
          # startet das installierte Programm und prüft, dass es läuft (kein Absturz beim Start)
          starts() {
            pkill -f 'python3 -m freestream' || true; sleep 1  # sonst holt der Start nur eine laufende Instanz nach vorne
            out=$(FREESTREAM_NO_UPDATE_CHECK=1 timeout 10 xvfb-run -a "$@" 2>&1) && rc=0 || rc=$?
            pkill -f 'python3 -m freestream' || true
            echo "$out"
            if [ "$rc" != 124 ] || echo "$out" | grep -q Traceback; then
              echo "::error::$* startet nicht (Rückgabewert $rc)"; return 1
            fi
          }
          # beide Programme in einem Paket
          sudo apt-get install -y ./dist/freestream_*.deb
          freedeck --version
          freedeck profiles
          freewave mixer --help
          starts freedeck
          starts freewave
          # Updates: das installierte Paket wird erkannt
          (cd / && python3 -c "import sys; sys.path.insert(0, '/opt/freestream'); from freestream import updater; p = updater.installed_packages(); print(p); assert set(p) == {'freestream'}")
          # einzeln: ersetzt das Paket freestream, beide arbeiten zusammen
          sudo apt-get install -y ./dist/freedeck_*.deb ./dist/freewave_*.deb
          freedeck --version
          freedeck mixer --help
          freewave mixer --help
          starts freedeck
          # nur FreeDeck: FreeWave-Befehle melden sich als nicht installiert
          sudo apt-get remove -y freewave
          freedeck profiles
          ! freedeck mixer
          # Umstieg vom alten Paketnamen: lindeck (alt) wird von freedeck ersetzt
          sudo apt-get remove -y freedeck
          sudo apt-get install -y ./dist/lindeck_*.deb
          lindeck --version
          freedeck --version
          sudo apt-get install -y ./dist/freedeck_*.deb
          ! dpkg -s lindeck 2>/dev/null | grep -q '^Status: install ok installed'
          lindeck --version

      - uses: actions/upload-artifact@v6
        with:
          name: freestream-deb
          path: dist/*.deb

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(python3 -c 'import freestream; print(freestream.__version__)')"
          fi
          if [ "${{ inputs.replace }}" = "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG wird neu angelegt"
            gh release delete "$TAG" --cleanup-tag --yes
            sleep 5
          fi
          NOTES="packaging/release-notes/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – Pakete bleiben, nur der Text wird aktualisiert"
          elif [ -f "$NOTES" ]; then
            # Ohne vorhandenen Tag legt gh ihn auf dem gebauten Commit an
            gh release create "$TAG" dist/*.deb --target "${GITHUB_SHA}" --title "FreeStream $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/*.deb --target "${GITHUB_SHA}" --title "FreeStream $TAG" --generate-notes
          fi

      - name: Release-Texte aktualisieren
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Text jedes vorhandenen Releases aus packaging/release-notes/<Tag>.md übernehmen
          for f in packaging/release-notes/v*.md; do
            [ -f "$f" ] || continue
            tag="$(basename "$f" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$f"
              echo "Text von $tag aktualisiert"
            fi
          done
