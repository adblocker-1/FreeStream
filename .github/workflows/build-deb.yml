name: Build .deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release v<Version> aus diesem Commit anlegen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-pil python3-evdev python3-cairosvg python3-tk \
            python3-pil.imagetk xvfb fonts-dejavu-core
          pip install --break-system-packages "streamdeck>=0.10" pyflakes pytest

      - name: Code prüfen
        run: python3 -m pyflakes lindeck tests

      - name: Tests
        run: xvfb-run -a python3 -m pytest -q tests

      - name: Paket bauen
        run: ./packaging/build-deb.sh dist

      - name: Paket testen
        run: |
          sudo apt-get install -y ./dist/*.deb
          lindeck --version
          lindeck profiles

      - uses: actions/upload-artifact@v4
        with:
          name: lindeck-deb
          path: dist/*.deb

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(python3 -c 'import lindeck; print(lindeck.__version__)')"
          fi
          NOTES="packaging/release-notes/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – Paket bleibt, nur der Text wird aktualisiert"
          elif [ -f "$NOTES" ]; then
            # Ohne vorhandenen Tag legt gh ihn auf dem gebauten Commit an
            gh release create "$TAG" dist/*.deb --target "${GITHUB_SHA}" --title "LinDeck $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/*.deb --target "${GITHUB_SHA}" --title "LinDeck $TAG" --generate-notes
          fi

      - name: Release-Texte aktualisieren
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Text jedes vorhandenen Releases aus packaging/release-notes/<Tag>.md übernehmen
          for f in packaging/release-notes/v*.md; do
            [ -f "$f" ] || continue
            tag="$(basename "$f" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$f"
              echo "Text von $tag aktualisiert"
            fi
          done
