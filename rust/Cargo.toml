[workspace]
resolver = "2"
members = ["crates/core", "crates/deck", "apps/freedeck"]

[workspace.package]
version = "0.39.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
freestream-core = { path = "crates/core" }
freestream-deck = { path = "crates/deck" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ab_glyph = "0.2"
resvg = "0.45"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
data-encoding = "2"
tempfile = "3"
elgato-streamdeck = "0.14"
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }
gtk4 = "0.11"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
