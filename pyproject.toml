[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlin"
version = "0.13.0"
description = "Stream Deck and Wave Link replacement for Linux: LinDeck and Linewave"
requires-python = ">=3.9"
dependencies = ["streamdeck>=0.10", "pillow", "evdev", "cairosvg"]

[project.scripts]
lindeck = "lindeck.__main__:main"
linewave = "lindeck.__main__:wave_main"

[tool.setuptools]
packages = ["lindeck"]

[tool.setuptools.package-data]
lindeck = ["locale/*.po", "locale/*.pot"]
