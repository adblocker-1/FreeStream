[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "freestream"
version = "0.29.1"
description = "Stream Deck and Wave Link replacement for Linux: FreeDeck and FreeWave"
requires-python = ">=3.9"
dependencies = ["streamdeck>=0.10", "pillow", "evdev", "cairosvg"]

[project.scripts]
freedeck = "freestream.__main__:main"
freewave = "freestream.__main__:wave_main"

[tool.setuptools]
packages = ["freestream"]

[tool.setuptools.package-data]
freestream = ["locale/*.po", "locale/*.pot"]
